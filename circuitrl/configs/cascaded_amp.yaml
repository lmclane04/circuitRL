# Two-Stage Cascaded Common-Source Amplifier (AC-Coupled)
# Stage 1: NMOS M1 + drain resistor RD1
# Stage 2: NMOS M2 + drain resistor RD2, independently biased
# AC-coupled between stages so DC operating points are decoupled.
# 6 parameters, 3 specs — intermediate complexity between cs_amp and opamp.

netlist: ../envs/cascaded_amp_template.sp

parameters:
  W1:  # Stage 1 NMOS width
    min: 1.0e-6
    max: 50.0e-6
    default: 25.0e-6      # midpoint (index 24 / 49 levels)
    step: 1.0e-6          # 1µm increments → 50 levels
  L1:  # Stage 1 NMOS length
    min: 0.18e-6
    max: 5.0e-6
    default: 2.5e-6       # midpoint (~index 23 / 48 levels)
    step: 0.1e-6          # 100nm increments → 49 levels
  RD1:  # Stage 1 drain resistor (ohms)
    min: 1000
    max: 50000
    default: 25000        # midpoint (index 48 / 98 levels)
    step: 500             # 500Ω increments → 98 levels
  W2:  # Stage 2 NMOS width
    min: 1.0e-6
    max: 50.0e-6
    default: 25.0e-6
    step: 1.0e-6
  L2:  # Stage 2 NMOS length
    min: 0.18e-6
    max: 5.0e-6
    default: 2.5e-6
    step: 0.1e-6
  RD2:  # Stage 2 drain resistor (ohms)
    min: 1000
    max: 50000
    default: 25000
    step: 500

# Spec pool: run `python generate_specs.py --config circuitrl/configs/cascaded_amp.yaml --n 500`
# to create this file before training.
target_spec_file: cascaded_amp_specs_pool.json

target_specs:
  gain_db:
    tolerance: 2.0
    direction: max        # higher gain is better
  bandwidth:
    tolerance: 2.0e6     # 2 MHz tolerance
    direction: max        # wider bandwidth is better
  power:
    tolerance: 0.05e-3   # 50 µW tolerance
    direction: min        # lower power is better

env:
  max_steps: 75
  sim_timeout: 15
  randomize_start: false

ppo:
  learning_rate: 3.0e-4
  n_steps: 1024
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  total_timesteps: 150000
