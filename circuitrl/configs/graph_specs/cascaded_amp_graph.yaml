# Graph prior for two-stage cascaded common-source amplifier.
# Stage 1: M1 (NMOS) + RD1 (resistor)
# Stage 2: M2 (NMOS) + RD2 (resistor), AC-coupled from stage 1
#
# This is the easiest transfer target from cs_amp: same component types (NMOS + resistor),
# same spec space (gain_db, bandwidth, power), just two copies of the cs_amp subgraph.
# The GNN should directly apply cs_amp representations to each stage here.
model_feature_dim: 5
model_feature_names:
  - active_device
  - gm_efficiency_prior
  - ro_prior
  - parasitic_load_prior
  - mismatch_sensitivity

components:
  - name: M1
    type: nmos
    parameters: [W1, L1]
    model_features: [1.0, 0.80, 0.60, 0.50, 0.70]

  - name: RD1
    type: resistor
    parameters: [RD1]
    model_features: [0.0, 0.00, 0.90, 0.10, 0.20]

  - name: M2
    type: nmos
    parameters: [W2, L2]
    model_features: [1.0, 0.80, 0.60, 0.50, 0.70]

  - name: RD2
    type: resistor
    parameters: [RD2]
    model_features: [0.0, 0.00, 0.90, 0.10, 0.20]

undirected: true
edges:
  - [M1, RD1]    # stage 1: transistor drives its drain resistor
  - [RD1, M2]    # interstage: AC coupling from stage 1 output to stage 2 input
  - [M2, RD2]    # stage 2: transistor drives its drain resistor
