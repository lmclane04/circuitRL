# Common-Source Amplifier

netlist: ../envs/cs_amp_template.sp

parameters:
  W1:  # NMOS width
    min: 1.0e-6
    max: 50.0e-6
    default: 10.0e-6
    step: 1.0e-6          # 1µm increments → 50 levels
  L1:  # NMOS length
    min: 0.18e-6
    max: 5.0e-6
    default: 0.5e-6
    step: 0.1e-6           # 100nm increments → 49 levels
  RD:  # Drain resistor (ohms)
    min: 1000
    max: 50000
    default: 10000
    step: 500               # 500Ω increments → 98 levels

# Physical constraints (evaluated on SI values)
constraints:
  - "W1 >= 5 * L1"      # W/L ratio >= 5 for reasonable transconductance

target_specs:
  gain_db:
    value: 20.0
    tolerance: 2.0
  bandwidth:
    value: 50000000.0  # 50 MHz
    tolerance: 10000000.0

# Range of specs sampled uniformly each episode during training.
# Feasibility (ro > Rout) is verified analytically before each reset.
# Remove this section to train on fixed targets only.
specs_range:
  gain_db:
    min: 14.0
    max: 26.0
  bandwidth:
    min: 25000000.0   # 25 MHz
    max: 100000000.0  # 100 MHz

env:
  max_steps: 100   # must be >= max grid size (RD=98 levels) so agent can reach any target from any start
  sim_timeout: 10

ppo:
  learning_rate: 3.0e-4
  n_steps: 256
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  total_timesteps: 30000   # ~30k sim calls for standalone train.py runs

bo:
  n_initial: 20         # random points to seed the GP
  kappa: 2.576          # UCB exploration weight (~99% confidence)
  n_candidates: 1000    # random candidates evaluated per acquisition step
  gp_update_freq: 5     # refit GP every N evaluations
  total_timesteps: 500  # total simulator calls

grpo:
  learning_rate: 3.0e-4
  group_size: 8         # G episodes per update, all from same start state
  clip_eps: 0.2
  n_epochs: 1           # single epoch per group (GRPO is typically 1-pass)
  ent_coef: 0.05        # higher than PPO — no critic, entropy is main exploration
  max_grad_norm: 0.5
  total_timesteps: 100000  # ~100k sim calls for standalone train.py runs
