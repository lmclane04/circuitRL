# PMOS LDO (low-dropout regulator)
# Simplified LDO with PMOS pass device, resistive feedback, and behavioral error amp.

netlist: ../envs/ldo_template.sp

parameters:
  Wp:
    min: 20.0e-6
    max: 500.0e-6
    default: 200.0e-6
    step: 10.0e-6
  Lp:
    min: 0.18e-6
    max: 3.0e-6
    default: 0.5e-6
    step: 0.1e-6
  Rtop:
    min: 10000
    max: 200000
    default: 50000
    step: 5000
  Rbot:
    min: 5000
    max: 100000
    default: 25000
    step: 5000
  Cc:
    min: 0.1e-12
    max: 10.0e-12
    default: 2.0e-12
    step: 0.1e-12
  Cout:
    min: 0.1e-6
    max: 20.0e-6
    default: 2.0e-6
    step: 0.1e-6

# Spec pool: run `python generate_specs.py --config circuitrl/configs/ldo.yaml --n 500`
target_spec_file: ldo_specs_pool.json

target_specs:
  vout_error:
    tolerance: 0.02
    direction: min
  line_reg_mv_v:
    tolerance: 20.0
    direction: min
  power:
    tolerance: 5.0e-3
    direction: min

env:
  max_steps: 80
  sim_timeout: 25
  randomize_start: false

ppo:
  learning_rate: 3.0e-4
  n_steps: 1024
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  total_timesteps: 150000

grpo:
  learning_rate: 3.0e-4
  group_size: 8
  clip_eps: 0.2
  n_epochs: 4
  ent_coef: 0.05
  max_grad_norm: 0.5
  total_timesteps: 150000

bo:
  n_initial: 30
  kappa: 2.576
  n_candidates: 1000
  gp_update_freq: 5
  total_timesteps: 500
